# Render Blueprint -- https://render.com/docs/blueprint-spec
#
# Free-tier layout: ONE web service (the FastAPI app, which already runs
# the abandoned-order-sweep job in-process via app.py's lifespan /
# shared/scheduler.py -- Render's free tier has no free background-worker
# or cron service type, so there is deliberately nothing else to deploy)
# plus ONE free Postgres database.
#
# NOTE: Render's free Postgres databases expire 30 days after creation.
# Before that, either upgrade the database's plan in the Render dashboard
# or take a fresh backup/restore -- there is no code-level workaround for
# this, it's a platform limit. See backend/README.md's Deployment section.
services:
  - type: web
    name: orderflow-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    # Runs after the image builds, before the new instance takes traffic --
    # keeps the schema current on every deploy without a manual step.
    preDeployCommand: alembic upgrade head
    envVars:
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: orderflow-db
          property: connectionString
      # Secrets and deploy-specific values -- set these in the Render
      # dashboard after the first Blueprint sync, not in this file.
      - key: JWT_SECRET
        sync: false
      - key: SECRETS_ENCRYPTION_KEY
        sync: false
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        sync: false
      # The Vercel URL your customer-facing ordering webview is deployed
      # to, e.g. https://orderflow.vercel.app (no trailing slash).
      - key: FRONTEND_BASE_URL
        sync: false
      # JSON array of allowed origins for the dashboard, e.g.
      # ["https://orderflow.vercel.app"]. Must match your Vercel domain
      # exactly (scheme + host), or the dashboard's API calls will be
      # blocked by CORS.
      - key: CORS_ALLOW_ORIGINS
        sync: false

databases:
  - name: orderflow-db
    databaseName: orderflow
    user: orderflow
    plan: free
    postgresMajorVersion: "16"
